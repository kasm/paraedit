            Instructions for working with the editor

Important note: at the moment, the perpendicular is built only between segments.

The editor has two workspaces - a graphic window and a command window. The user can enter data in any of the windows. The status of another window is updated automatically.
Data entry in the graphics window is performed using the toolbar. The following commands are currently supported:
Geometric elements - line, line, circle.
The relationships between the elements: snap to the middle, snap to the intersection, plotting the perpendicular and tangent circle.

The order of construction of primitives:
User selects primitive from toolbar and chooses one or several points in the graphics area.
Editing primitives:
When you hover over an element, control points appear. For editing, you need to click once on the control point with the mouse, move the cursor to required place and left click the mouse a second time.

Work with binding
1. Snap to the middle of the segment. First, the point to be snapped is selected. It can be the end of a line segment or the center of a circle.
Then a segment is selected, to which the binding will be made. Control points that are used to set the line and the radius of the circle cannot be snapped.
2. Snap to the intersection. The point to be snapped is selected. Then a pair of elements is selected, to the intersection of which the binding will be made. If there are several intersections, the nearest intersection to the last mouse click will be selected.
3. Construction of the prependicular. A segment is selected that becomes a perpendicular, then a segment onto which a perpendicular is dropped.
4. Snapping a circle. A circle is selected, then two elements (line, line segment, circle) to which the first specified circle will be attached. Then the user selects the placement of the tangent circle.
Also in the text box mode, the "equality" binding is available. For example, you can make the radius of one circle equal to the radius of another circle as follows:
c0001 [1] = eq ("c0000 [1]")
Here c0000, c0001 are respectively independent and dependent circles (more precisely, their names).
c0000 [1] - access to the second element of the circle data array (this is the radius)
Circle data structure:
[[xc, yc], r]
Having information about the data structure of the element, you can set the dependence of any scalar parameter.

        <textarea style="height: 300px; width: 100%; display: none;">
            Инструкция по работе с редактором

Важное замечание: на данный момент перпендикуляр строится только между отрезками.

Редактор имеет две рабочие области - графическое окно и окно команд. Пользователь может вводить данные в любом из окон. Состояние другого окна обновляется автоматически.
Ввод данных в графическом окне производится при помощи панели инструментов. В настоящее время поддерживаются следующие команды:
Геометрические элементы - линия, прямая, окружность.
Взаимосвязи между элементами: привязка к середине, привязка к пересечению, построение перпендикуляра и касательная окружность.

Порядок построения примитивов:
В панели инструментов выбирается элемент и указываются точки, необходимые для построения этого элемента.
Редактирование примитивов:
При наведении на элемент появляются управляющие точки. Для редактирования нужно один раз щелкнуть мышкой на управляющую точку, переместить курсор в нужном направлении и щелкнуть мышкой второй раз.

Работа с привязкой
1. Привязка к середине отрезка. Сначала выбирается точка, которая будет привязана. Это может быть конец отрезка или центр окружности.
Затем выбирается отрезок, к оторому будет производится привязка. Управляющие точки которые используются для задания прямой и радиуса окружности не могут быть привязаны.
2. Привязка к пересечению. Выбирается точка, которая будет привязана. Затем выбирается пара элементов, к пересечению которых будет производится привязка. Если пересечений несколько, будет выбрана ближайшее пересечение к последнему нажатию мышки.
3. Построение препендикуляра. Выбирается отрезок, который станет перпендикуляром, затем отрезок, на который будет опущен перпендикуляр.
4. Привязка окружности. Выбирается окружность, затем два элемента (линия, отрезок, окружность), к которым будет привязана первая указанная окружность. Затем пользователь выбирает вариант размещения касательной окружности.
Также в режиме текстового окна доступна привязка "равенство". Например, можно сделать радиус одной окружности равным радиусу другой окружности следующим образом:
c0001[1]=eq("c0000[1]")
Здесь c0000, c0001 соотвественно независимая и зависимая окружности (точнее их имена).
c0000[1] - обращение ко второму элементу массива данных окружности (это радиус)
Структура данных окружности:
[[xc, yc], r]
Имея информацию о структуре данных элемента, можно задать зависимость любого скаларного параметра.

    function getPointsMuff2(alfa) {
        var rez = {};
        var scale = 4;
        var R0 = scale*63;
        var R1 = scale*69.7;
        var Rout = scale*73;
        var Ri = scale*18;
        var Rt = scale*3;
        var a1 = 27 * Math.PI / 180.;
        var a2 = 45 * Math.PI / 180.;
        var p0 = [R0 * Math.sin(alfa), R0 * Math.cos(alfa)];
        var p1 = [R1 * Math.sin(alfa+a1), R1 * Math.cos(alfa+a1)];
        var p2 = [R0 * Math.sin(alfa+a2), R0 * Math.cos(alfa+a2)];
        var c0 = [p0,Ri];
        var c1 = [p1,Ri];
        var c = [[0,0],0];

        //     find center of the circle

        editor.gc.point_int_circle_circle_radius_selector(
            c,         //   result
            [p0,Ri],   //   circle at p0 with R = Ri
            [p1,Ri],   //   circle at p1 with R = Ri
            0,         //   radius of the "tangent circle"
            [1, 1, 1]  //   selector
        );


        rez.p0 = p0;
        rez.p1 = p1;
        rez.p2 = p2;
        rez.c = c;
        return rez;
    };

    function getPlinePointsCNC(offset) {
        var n = 8;
        var a = [];
        var ps = [];
        var d = [300,300];
        var s = '';
        var scale = 4;
        var R0 = scale*63;
        var R1 = scale*69.7;
        var Rout = scale*73;
        var Ri = scale*18;
        var Rt = scale*3;
        var ps0 = [];

        for (i=0; i<n; i++) {
            var da = 2 * Math.PI / n;
            var ci;
            var p0t = [0, 0];
            var p1t = [0, 0];
            a.push(getPointsMuff2(i * da));
            a[i].ci = [[a[i].c[0], a[i].c[1]], Ri - offset];
        };

        for (i=0; i<n; i++) {
            a[i].p0t = [0, 0];
            var ap = a[(i + n - 1) % n].p1;   //   p1 of prev section
            //   find point p0t
            editor.gc.point_int_lineseg_circle_radius_selector(
                a[i].p0t,         //  result
                [ap, a[i].p0],    //  line segment with prev p1 and p0
                [a[i].c, Ri],     //  circle equation
                offset,           //  tool radius
                [1, -1, 1]        //  selector
            );
            a[i].p1t = [0, 0];
            //   find point p1t
            editor.gc.point_int_lineseg_circle_radius_selector(
                a[i].p1t, [a[i].p1, a[i].p2], [a[i].c, Ri ], offset, [-1, -1, 1]
            );
        };

        for (i=0; i<n; i++) {
            //a[i].ci = [[a[i].c[0], a[i].c[1]], Ri - offset];
            s+= 'G01 X' + (d[0]+a[i].p0t[0]).toFixed(3) +
            ' Y' + (d[1] + a[i].p0t[1]).toFixed(3)+'\n';

            s+= 'G02 X' + (d[0]+a[i].p1t[0]).toFixed(3) +
                ' Y' + (d[1] + a[i].p1t[1]).toFixed(3)+
                    //'\n';
                    ' I'+ (a[i].c[0]-a[i].p0t[0]).toFixed(3)+
                    ' J'+ (a[i].c[1]-a[i].p0t[1]).toFixed(3)+'\n';
            s+= 'G01 X' + (d[0]+a[(i+1)%n].p0t[0]).toFixed(3) +
                ' Y' + (d[1] + a[(i+1)%n].p0t[1]).toFixed(3)+'\n';

            //addPnt(ps, a[i].p0, d);
            //addPnt(ps, a[i].p1, d);
            addPnt(ps, a[i].p0t, d);
            addPnt(ps, a[i].p1t, d);

        };
        var tt = parser.CNCsplitter(s);
        var tt2 = parser.CNCsplitted2pointsArray(tt);


        return {CNC: s, ps: ps, a: a, tt: tt2};
    };

    function getPointsMuff(alfa) {
        var rez = {};
        var scale = 4;
        var R0 = scale*63;
        var R1 = scale*69.7;
        var Rout = scale*73;
        var Ri = scale*18;
        var Rt = scale*3;
        var a1 = 27 * Math.PI / 180.;
        var a2 = 45 * Math.PI / 180.;
        var p0 = [R0 * Math.sin(alfa), R0 * Math.cos(alfa)];
        var p1 = [R1 * Math.sin(alfa+a1), R1 * Math.cos(alfa+a1)];
        var p2 = [R0 * Math.sin(alfa+a2), R0 * Math.cos(alfa+a2)];
        var L01 = Math.sqrt( (p1[0] - p0[0]) * (p1[0] - p0[0]) +
            (p1[1] - p0[1]) * (p1[1] - p0[1]));
        var h = Math.sqrt( Ri*Ri - L01*L01/4);
        var pm = [ (p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2];
        var lm = []; editor.gc.line_point_point(lm, p0,p1);
        var c = [pm[0] - h * lm[0], pm[1] - h * lm[1]];
        rez.p0 = p0;
        rez.p1 = p1;
        rez.p2 = p2;
        rez.c = c;
        return rez;
    };

            ps.push(a[i].p0);

        for (i=0; i<n; i++) {

        return {ps: ps, cs: a[0].cout, csss: s, a: a};
    };
