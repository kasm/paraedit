            Инструкция по работе с редактором

Важное замечание: на данный момент перпендикуляр строится только между отрезками.

Редактор имеет две рабочие области - графическое окно и окно команд. Пользователь может вводить данные в любом из окон. Состояние другого окна обновляется автоматически.
Ввод данных в графическом окне производится при помощи панели инструментов. В настоящее время поддерживаются следующие команды:
Геометрические элементы - линия, прямая, окружность.
Взаимосвязи между элементами: привязка к середине, привязка к пересечению, построение перпендикуляра и касательная окружность.

Порядок построения примитивов:
В панели инструментов выбирается элемент и указываются точки, необходимые для построения этого элемента.
Редактирование примитивов:
При наведении на элемент появляются управляющие точки. Для редактирования нужно один раз щелкнуть мышкой на управляющую точку, переместить курсор в нужном направлении и щелкнуть мышкой второй раз.

Работа с привязкой
1. Привязка к середине отрезка. Сначала выбирается точка, которая будет привязана. Это может быть конец отрезка или центр окружности.
Затем выбирается отрезок, к оторому будет производится привязка. Управляющие точки которые используются для задания прямой и радиуса окружности не могут быть привязаны.
2. Привязка к пересечению. Выбирается точка, которая будет привязана. Затем выбирается пара элементов, к пересечению которых будет производится привязка. Если пересечений несколько, будет выбрана ближайшее пересечение к последнему нажатию мышки.
3. Построение препендикуляра. Выбирается отрезок, который станет перпендикуляром, затем отрезок, на который будет опущен перпендикуляр.
4. Привязка окружности. Выбирается окружность, затем два элемента (линия, отрезок, окружность), к которым будет привязана первая указанная окружность. Затем пользователь выбирает вариант размещения касательной окружности.
Также в режиме текстового окна доступна привязка "равенство". Например, можно сделать радиус одной окружности равным радиусу другой окружности следующим образом:
c0001[1]=eq("c0000[1]")
Здесь c0000, c0001 соотвественно независимая и зависимая окружности (точнее их имена).
c0000[1] - обращение ко второму элементу массива данных окружности (это радиус)
Структура данных окружности:
[[xc, yc], r]
Имея информацию о структуре данных элемента, можно задать зависимость любого скаларного параметра.
