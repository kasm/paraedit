<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        .editor {
            float: left;
            width: 630px;
            height: 630px;
            border: 1px;
            border-color: black;
        }
        .text1 {
            float: left;
            width: 300px;
            height: 600px;
            border: 1px;
            background-color:#eee;
            border-color: black;
        }
        .row:after {
            content: "";
            display: table;
            clear: both;
        }


        .myButton {
            -moz-box-shadow: 0px 0px 0px 0px #3dc21b;
            -webkit-box-shadow: 0px 0px 0px 0px #3dc21b;
            box-shadow: 0px 0px 0px 0px #3dc21b;
            background-color:#44c767;
            -moz-border-radius:7px;
            -webkit-border-radius:7px;
            border-radius:7px;
            border:1px solid #18ab29;
            display:inline-block;
            cursor:pointer;
            color:#ffffff;
            font-family:Arial;
            font-size:21px;
            padding:9px 31px;
            text-decoration:none;
            text-shadow:0px 1px 0px #2f6627;
        }
        .myButton:hover {
            background-color:#5cbf2a;
        }
        .myButton:active {
            position:relative;
            top:1px;
        }
        .imgButton:active {
            position:relative;;
            top: 3px;
        }

    </style>
</head>
<body>
<div>
    <table border="1" border-color="black">
        <tr><td colspan="3" align="center" style="font-size:18pt">Web based graphics editor with geometry parametrization</td></tr>

        <tr>
            <td align="center">Elements<br>
                <img src="img/lineseg64x64.png" onclick="editor.lineseg()" class="imgButton">
                <img src="img/line64x64.png" onclick="editor.line()" class="imgButton" >
                <img src="img/circle64x64.png" onclick="editor.circle()" class="imgButton">
            </td><td>  </td>
            <td align="center">
                Links<br>
                <img src="img/mid64x64.png" onclick="editor.mid()" class="imgButton">
                <img src="img/per64x64.png" onclick="editor.per_ls()" class="imgButton">
                <img src="img/int64x64.png" onclick="editor.int()" class="imgButton">
                <img src="img/tan64x64.png" onclick="editor.tan2()" class="imgButton">
        </td>
        </tr>
   </table>

</div>
<div>
<div style="border-color: black; border: 3px" class="editor">
    <div>
    Editor working area:<br>
    <canvas id='c1' width="600px" height="600px" style="border: 1px; border-color: green; border-style: solid; width: 600px; height: 600px" ></canvas>
    </div>
    Status:<br>
    <div id="status">

    </div>
</div>
    <div class="text1">
        Text area:
        <textarea title="" id="t1" class="text1" style="border: 1px; border-color: green; border-style: solid;"
                  onmouseout="editor.textAreaLeave()" onkeyup="editor.textAreaChanged()">

        </textarea>

    </div>

</div>

<script src="index.js"></script>

</body>
</html>
